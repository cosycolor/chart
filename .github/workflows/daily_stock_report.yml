name: Daily Stock Analysis & Tistory Publisher

on:
  schedule:
    # 평일(월-금) 한국 시간 15:40 (UTC 06:40) 자동 실행
    - cron: '40 6 * * 1-5'
  workflow_dispatch:
    # 깃허브 웹상에서 언제든 [Run workflow] 버튼으로 수동 실행 가능

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Korean Fonts for Matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Analysis & Publish to Tistory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_CATEGORY_ID: ${{ secrets.TISTORY_CATEGORY_ID }}
          TISTORY_VISIBILITY: ${{ secrets.TISTORY_VISIBILITY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python main.py

      - name: Upload Generated Reports and Charts Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-report-${{ github.run_id }}
          path: |
            output/
          retention-days: 7
